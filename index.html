<title>작전명: OSINT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230B0F19'/%3E%3Cpath d='M2 8h12M8 2v12' stroke='%2300F0FF' stroke-width='1.5'/%3E%3C/svg%3E" />
<style>
  :root {

    --panel: #101726;
    --panel-2: #0d1320;
    --line: rgba(0, 240, 255, 0.28);

    --red: #FF2A54;
    --amber: #f0b429;
    --text: #d7e4f0;
    --muted: #8b9bb3;
    --ok: #3ddc97;
    --mono: "WenQuanYi Micro Hei Mono", "Noto Sans Mono CJK KR", "NanumGothicCoding", ui-monospace, monospace;
    --sans: "WenQuanYi Micro Hei", "Noto Sans CJK KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

  .app { min-height: 100vh; display: flex; flex-direction: column; background:

  .stages { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; }
  .stages button, .sfx, .ghost {

  .stages button.done { border-color: var(--ok); }
  .riskbox { min-width: 220px; }
  .riskbox .lbl { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .riskbox .lbl strong { color: var(--cyan); }
  .riskbox[data-hot="1"] .lbl strong { color: var(--red); }
  .bar { height: 8px; background: #1b2436; margin-top: 6px; position: relative; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--cyan); transition: width 0.35s ease; }
  .riskbox[data-hot="1"] .bar > i { background: var(--red); box-shadow: 0 0 12px var(--red); }
  .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent, transparent calc(25% - 1px), rgba(11,15,25,0.9) calc(25% - 1px), rgba(11,15,25,0.9) 25%); }
  .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 270px minmax(0, 1fr) 340px; gap: 10px; padding: 10px; }
  .panel { background: rgba(16, 23, 38, 0.94); border: 1px solid var(--line); min-width: 0; position: relative; display: flex; flex-direction: column; min-height: 280px; }
  .panel h2 { margin: 0; padding: 10px 12px; font-size: 12px; letter-spacing: 0.14em; font-family: var(--mono); color: var(--cyan); border-bottom: 1px solid rgba(0,240,255,0.14); }
  .scroll { overflow: auto; padding: 10px; min-height: 0; flex: 1; }
  .source { width: 100%; text-align: left; background: #0d1422; border: 1px solid rgba(255,255,255,0.06); padding: 10px; margin-bottom: 8px; display: grid; grid-template-columns: 36px 1fr; gap: 8px; }
  .source.on { border-color: var(--cyan); }
  .source .ico { width: 36px; height: 36px; display: grid; place-items: center; font-family: var(--mono); color: var(--bg); background: var(--cyan); font-size: 12px; font-weight: 700; }
  .source.ig .ico { background: #ff4d8d; }
  .source.delivery .ico { background: #3ddc97; color: #06281c; }
  .source.run .ico { background: #f0b429; color: #2a1c00; }
  .source.chat .ico { background: #ffe14a; color: #2a2200; }
  .source.parcel .ico { background: #d7a16e; color: #2a1608; }
  .source.blog .ico { background: #efe6d6; color: #2a2118; }
  .source b { display: block; font-size: 13px; }
  .source small { color: var(--muted); font-size: 11px; }
  .viewer-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; margin-bottom: 8px; }
  .viewer-head h3 { margin: 0; font-size: 16px; }
  .viewer-head span, .meta { color: var(--muted); font-family: var(--mono); font-size: 11px; }
  .post { background: #0c121d; border: 1px solid rgba(255,255,255,0.06); padding: 10px; }
  .who { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #244, #0ff); display: grid; place-items: center; font-size: 12px; color: #041018; font-weight: 700; }
  .figure { position: relative; background: #070b12; border: 1px solid rgba(0,240,255,0.15); }

  .figure-tools { position: absolute; left: 8px; bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
  .figure-tools button { background: rgba(6, 10, 18, 0.88); border: 1px solid var(--cyan); color: var(--cyan); padding: 7px 9px; font-family: var(--mono); font-size: 12px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .tools button, .submit, .primary, .dialog .collect {
    background: transparent; border: 1px solid var(--cyan); color: var(--cyan);
    padding: 8px 10px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
  }
  .tools button:hover, .submit:hover, .primary:hover, .dialog .collect:hover { background: rgba(0,240,255,0.1); }
  .caption { line-height: 1.65; font-size: 14px; }
  .hot {
    background: rgba(255, 42, 84, 0.14); color: #fff; border: 0;
    border-bottom: 1px dashed var(--red); padding: 0 3px; font-size: inherit; line-height: inherit;

  .hot.got { background: rgba(0, 240, 255, 0.12); color: var(--cyan); border-bottom-color: var(--cyan); }
  .figure-tools .hot { border: 1px solid var(--cyan); background: rgba(6, 10, 18, 0.88); padding: 7px 9px; }
  .exif { margin: 0; padding: 10px; background: #071018; color: var(--cyan); font-family: var(--mono); font-size: 12px; line-height: 1.55; border: 1px solid var(--line); overflow: auto; }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 100%; background: #1c2433; border-left: 3px solid #ffe14a; padding: 8px 10px; line-height: 1.6; }
  .bubble .meta { margin-bottom: 4px; }
  .review { border-left: 3px solid #3ddc97; }
  .blog { background: #16130f; }
  .blog h3 { margin: 6px 0; }
  .stars { color: var(--amber); letter-spacing: 2px; }
  .log { margin-top: 10px; border-top: 1px dashed rgba(0,240,255,0.2); padding-top: 8px; }
  .log h4 { margin: 0 0 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.12em; }
  .log li { list-style: none; font-family: var(--mono); font-size: 11px; color: #b7c6d6; margin: 3px 0; }
  .log ul { margin: 0; padding: 0; }
  .obj { color: var(--muted); font-size: 12px; margin: 0 0 8px; line-height: 1.5; }
  .clue, .intel { width: 100%; text-align: left; display: block; margin-bottom: 8px; padding: 8px; background: #0c1422; border: 1px solid rgba(255,255,255,0.08); }
  .clue.on { border-color: var(--cyan); box-shadow: inset 3px 0 0 var(--cyan); }
  .intel { border-color: rgba(240, 180, 41, 0.55); background: #16140d; }
  .tag { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: var(--cyan); }
  .intel .tag { color: var(--amber); }
  .clue strong, .intel strong { display: block; margin: 3px 0; font-size: 13px; }
  .clue em, .intel p { font-style: normal; color: var(--muted); font-size: 12px; line-height: 1.45; margin: 0; }
  .selmark { float: right; color: var(--cyan); font-family: var(--mono); font-size: 10px; }
  .empty { color: var(--muted); font-size: 12px; line-height: 1.5; }
  .board-actions { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; position: sticky; bottom: 0; z-index: 2; background: linear-gradient(transparent, #101726 10px); padding-top: 8px; }
  .combine { background: var(--cyan); color: #041018; border: 0; padding: 10px; font-weight: 700; letter-spacing: 0.04em; }
  .combine:disabled { background: #1d2a36; color: var(--muted); cursor: not-allowed; }
  .pair { font-family: var(--mono); font-size: 11px; color: var(--muted); min-height: 16px; }
  .locked-report, .cleared-box, .report-form { border: 1px solid rgba(255,42,84,0.35); padding: 10px; background: #120910; }
  .locked-report ul, .report-form { margin: 8px 0 0; padding: 0; list-style: none; }
  .locked-report li { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
  .hint { color: var(--amber); font-size: 12px; }
  fieldset { border: 0; margin: 0 0 8px; padding: 0; }
  legend { font-size: 12px; color: var(--cyan); padding: 0; margin-bottom: 4px; }
  .opt { width: 100%; text-align: left; background: #0c121c; border: 1px solid rgba(255,255,255,0.08); padding: 8px; margin-bottom: 4px; font-size: 12px; line-height: 1.4; }
  .opt.on { border-color: var(--cyan); }
  .opt.bad { border-color: var(--red); color: #ffd0da; }
  .submit { width: 100%; background: var(--red); color: white; border-color: var(--red); font-weight: 700; }
  .is-new { animation: pop 0.45s ease; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0.2; } to { transform: none; opacity: 1; } }
  .shake { animation: shake 0.35s linear; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .lens-hot { cursor: zoom-in; }
  .lens-hot:hover { stroke: var(--cyan); stroke-width: 2; }
  .gap-hit { cursor: pointer; }
  .addr-hit { cursor: pointer; }
  .addr-hit:hover { stroke: var(--cyan); }
  .overlay { position: fixed; inset: 0; background: rgba(4, 6, 12, 0.78); z-index: 240; display: grid; place-items: center; padding: 18px; }

  .overlay.intro { z-index: 300; background: rgba(4, 6, 12, 0.88); }
  .dialog, .sheet { width: min(920px, 100%); background: #0e1524; border: 1px solid var(--cyan); padding: 42px 14px 14px; position: relative; max-height: calc(100vh - 88px); overflow: auto; }
  .dialog .collect { display: inline-block; margin-top: 10px; }
  .dialog .x, .sheet .x { position: absolute; top: 8px; right: 8px; background: transparent; border: 1px solid var(--line); color: var(--text); padding: 4px 8px; }
  .intro-card { width: min(640px, 100%); border: 1px solid var(--cyan); background: #0b1220; padding: 22px; }

  .intro-card p { line-height: 1.6; color: #c9d6e5; }
  .primary { background: var(--cyan); color: #041018; border: 0; padding: 10px 14px; font-weight: 800; }
  .dead-card, .sheet { width: min(980px, 100%); }
  .dead-card { border: 1px solid var(--red); background: #16080e; padding: 22px; }
  .dead-card h2 { color: var(--red); font-family: var(--mono); letter-spacing: 0.08em; }
  .banner { background: var(--red); color: white; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .banner b { letter-spacing: 0.14em; font-family: var(--mono); }
  .sheet { width: min(1080px, 100%); border-color: var(--red); padding: 0; overflow: auto; max-height: calc(100vh - 88px); }
  .sheet .body { padding: 14px; }
  .chains { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .chains li { display: grid; grid-template-columns: 1fr 36px 1fr 36px 1fr; gap: 6px; align-items: stretch; }
  .node { background: #0c121c; border: 1px solid rgba(255,255,255,0.08); padding: 8px; min-width: 0; }
  .node.secret { border-color: rgba(255,42,84,0.6); }
  .node .k { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--amber); }
  .node.secret .k { color: var(--red); }
  .node p { margin: 4px 0 0; font-size: 13px; line-height: 1.45; }
  .arrow { position: relative; align-self: center; height: 2px; background: linear-gradient(90deg, var(--red), var(--cyan)); }
  .arrow::after { content: ""; position: absolute; right: -2px; top: -4px; border: 5px solid transparent; border-left-color: var(--cyan); }
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
  .rule { border: 1px solid var(--line); padding: 10px; background: #0b121c; }
  .rule b { font-family: var(--mono); color: var(--cyan); display: block; margin-bottom: 6px; }
  .rule p { margin: 0; font-size: 13px; line-height: 1.5; }
  .sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .fine { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .scanline { pointer-events: none; position: fixed; inset: 0; z-index: 20; opacity: 0.08; background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.35), rgba(255,255,255,0.35) 1px, transparent 1px, transparent 3px); }
  .fly-card { position: fixed; z-index: 400; pointer-events: none; background: #062027; color: var(--cyan); border: 1px solid var(--cyan); padding: 8px 10px; font-size: 12px; font-family: var(--mono); transition: transform 0.65s cubic-bezier(.2,.7,.2,1), opacity 0.65s; }
  .toast { position: fixed; z-index: 450; left: 50%; bottom: 18px; transform: translateX(-50%); background: #1a0d14; border: 1px solid var(--red); color: white; padding: 10px 12px; font-size: 13px; animation: fade 2.6s forwards; }
  @keyframes fade { 0% { opacity: 0; } 12% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .app.glitching .workspace { animation: gshift 0.12s steps(2) infinite; }
  @keyframes gshift {
    0% { transform: translate(0, 0); }

    50% { transform: translate(6px, -2px); }
    75% { transform: translate(-3px, 2px); filter: saturate(2); }
    100% { transform: none; }
  }
  @media (max-width: 1100px) {
    .app { height: auto; }
    .workspace { grid-template-columns: 1fr 1fr; height: auto; }
    .panel.board { grid-column: 1 / -1; }
    .chains li { grid-template-columns: 1fr; }
    .arrow { width: 2px; height: 22px; justify-self: center; background: linear-gradient(var(--red), var(--cyan)); }
    .arrow::after { right: -4px; top: auto; bottom: -6px; border: 5px solid transparent; border-top-color: var(--cyan); border-left-color: transparent; }
    .rules { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .workspace { grid-template-columns: 1fr; }
    .riskbox { min-width: 160px; }
    .intro-card h1 { font-size: 26px; }
  }
  @media (min-width: 1101px) {
    .app { height: 100vh; overflow: hidden; }
    .workspace { height: calc(100vh - 62px); }
    .panel { height: 100%; overflow: hidden; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>

  }).join("") || `<p class="empty">수집된 단서 없음. 중앙 화면의 붉은 구절, 렌즈, EXIF, 지도 공백, 송장을 지정하십시오.</p>`;

  let form;

function bumpRisk(reason) {
  const p = prog();
  p.risk = Math.min(100, p.risk + 25);
  log("역추적 위험 +25% · " + reason + " · 현재 " + p.risk + "%");
  if (p.risk >= 100) {
    p.gameOver = true;
    warnSound();
    state.zoom = null;
    render();
    return;
  }
  state.shake = true;
  warnSound();
  render();
  toast(reason);
}

function collect(id, origin) {
  const s = stage();
  const p = prog();
  if (p.gameOver || state.glitch) return;
  const clue = s.clues[id];
  if (!clue) return;
  const rect = origin ? origin.getBoundingClientRect() : null;
  if (p.collected.includes(id)) { toast("이미 보관된 단서입니다."); return; }
  p.collected.push(id);
  state.justId = id;
  log("단서 확보 · " + clue.title);
  collectSound();
  render();
  fly(rect, document.querySelector(`[data-clue-card="${id}"]`), clue.title);
}

function combine(origin) {
  const s = stage();
  const p = prog();
  if (p.gameOver || p.selected.length !== 2) return;
  const found = s.combines.find((c) => pairKey(c.a, c.b) === pairKey(p.selected[0], p.selected[1]));
  const rect = origin ? origin.getBoundingClientRect() : null;
  if (!found) {
    p.selected = [];
    log("교차 분석 실패 · 연관성 없음");
    bumpRisk("무관한 단서 조합");
    return;
  }
  if (p.intel.includes(found.intel)) {
    p.selected = [];
    toast("이미 확인된 교차 분석입니다.");
    render();
    return;
  }
  p.intel.push(found.intel);
  p.selected = [];
  const info = s.intels[found.intel];
  state.justId = "intel:" + found.intel;
  log("핵심 첩보 · " + info.title);
  okSound();
  render();
  fly(rect, document.querySelector(`[data-intel-card="${found.intel}"]`), info.title);
}

function submit() {
  const s = stage();
  const p = prog();
  if (p.gameOver || p.cleared || state.glitch) return;
  if (!s.combines.every((c) => p.intel.includes(c.intel))) { toast("핵심 첩보 2건을 먼저 확보하십시오."); return; }
  if (s.questions.some((q) => !p.answers[q.id])) { toast("최종 기밀 3가지를 모두 선택하십시오."); return; }
  const wrong = s.questions.filter((q) => p.answers[q.id] !== q.correct).map((q) => q.id);
  if (wrong.length) {
    state.wrongQs = wrong;
    log("작전 보고서 불일치");
    bumpRisk("보고서가 첩보와 일치하지 않습니다");
    return;
  }
  state.wrongQs = [];
  p.cleared = true;
  log("작전 보고서 채택 · 기밀 3건 확정");
  clearSound();
  state.glitch = true;
  state.zoom = null;
  render();
  setTimeout(() => {
    state.glitch = false;
    state.report = true;
    render();
  }, 1100);
}

document.body.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");
  if (action === "noop") return;
  if (state.intro && action !== "start" && action !== "sound") return;
  const p = prog();
  if (action === "sound") { state.sound = !state.sound; render(); return; }
  if (action === "start") { state.intro = false; log("분석 개시"); render(); return; }
  if (action === "stage") {
    state.stageId = Number(el.getAttribute("data-id"));
    state.sourceId = stage().sources[0].id;
    state.zoom = null; state.report = false; state.wrongQs = []; state.glitch = false;
    render(); return;
  }
  if (p.gameOver && action !== "restart" && action !== "stage" && action !== "sound") return;
  if (action === "restart") {
    state.byStage[state.stageId] = fresh();
    state.zoom = null; state.report = false; state.wrongQs = []; state.justId = null;
    render(); return;
  }
  if (action === "source") { state.sourceId = el.getAttribute("data-id"); render(); return; }
  if (action === "zoom") { state.zoom = el.getAttribute("data-zoom"); render(); return; }
  if (action === "close-zoom") { state.zoom = null; render(); return; }
  if (action === "exif") { p.exifOpen = true; collect("exif", el); return; }
  if (action === "collect") { collect(el.getAttribute("data-id"), el); return; }
  if (action === "select") {
    const id = el.getAttribute("data-id");
    if (!p.collected.includes(id)) return;
    const i = p.selected.indexOf(id);
    if (i >= 0) p.selected.splice(i, 1);
    else {
      if (p.selected.length === 2) p.selected.shift();
      p.selected.push(id);
    }
    render(); return;
  }
  if (action === "combine") { combine(el); return; }
  if (action === "answer") {
    p.answers[el.getAttribute("data-q")] = el.getAttribute("data-val");
    state.wrongQs = state.wrongQs.filter((q) => q !== el.getAttribute("data-q"));
    render(); return;
  }
  if (action === "submit") { submit(); return; }
  if (action === "open-report") { state.report = true; render(); return; }
  if (action === "close-report") { state.report = false; render(); }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape" && state.zoom) { state.zoom = null; render(); }
});
render();
</script>
</body>
